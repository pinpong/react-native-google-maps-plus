name: Pull Request Validation
on:
  pull_request:
    branches: [dev, main]

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint commit messages
        run: |
          yarn commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
  lint:
    runs-on: macos-26
    needs: [commitlint]
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Generate nitrogen code
        run: yarn nitrogen

      - name: Install ktlint & swiftformat
        run: |
          brew install ktlint
          brew install swiftformat

      - name: Lint files
        run: yarn lint

      - name: Typecheck files
        run: yarn typecheck

  test:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run unit tests
        run: yarn test --maxWorkers=2 --coverage

  docs:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Generate nitrogen code
        run: yarn nitrogen

      - name: Build docs
        run: yarn docs

      - name: Typecheck docs
        run: yarn workspace react-native-google-maps-plus-docs typecheck

  build-android:
    runs-on: ubuntu-latest
    needs: [lint, test, docs]
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0
          submodules: true

      - name: Setup
        uses: ./.github/actions/setup

      - name: Generate nitrogen code
        run: yarn nitrogen

      - name: Install JDK
        uses: actions/setup-java@v5.2.0
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Finalize Android SDK
        run: |
          /bin/bash -c "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null"

      - name: Cache Gradle
        uses: actions/cache@v5.0.5
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('example/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Create secrets.properties
        run: |
          echo MAPS_API_KEY="API_KEY" >> example/android/secrets.properties

      - name: Build example for Android
        env:
          JAVA_OPTS: '-XX:MaxHeapSize=6g'
        run: yarn build:android

      - name: Build the native library without svg text shaping
        working-directory: example/android
        env:
          JAVA_OPTS: '-XX:MaxHeapSize=6g'
        run: ./gradlew ':react-native-google-maps-plus:buildCMakeDebug[arm64-v8a]' -PreactNativeArchitectures=arm64-v8a -PRNGoogleMapsPlus_svgTextShaping=false
  build-ios:
    runs-on: macos-26
    needs: [lint, test, docs]
    env:
      XCODE_VERSION: '26.2'
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0
          submodules: true

      - name: Setup
        uses: ./.github/actions/setup

      - name: Generate nitrogen code
        run: yarn nitrogen

      - name: Use appropriate Xcode version
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Check the pods without svg text shaping
        working-directory: example/ios
        env:
          RNGOOGLEMAPSPLUS_SVG_TEXT_SHAPING: '0'
        run: |
          bundle install
          bundle exec pod install
          if grep -q -E 'RNSvgHarfBuzz|SheenBidi\.c' Pods/Pods.xcodeproj/project.pbxproj || grep -q LUNASVG_ENABLE_TEXT_SHAPING "Pods/Target Support Files/RNGoogleMapsPlus/RNGoogleMapsPlus.debug.xcconfig"; then
            echo "Text shaping is still part of the pod"
            exit 1
          fi

      - name: Install cocoapods
        working-directory: example
        run: yarn ios:pods

      - name: Create Secrets.xcconfig
        run: echo MAPS_API_KEY="API_KEY" >> example/ios/Secrets.xcconfig

      - name: Build example for iOS
        run: yarn build:ios
