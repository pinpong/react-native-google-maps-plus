name: Prepare dev branch for next release

on:
  workflow_run:
    workflows: ['Release Package']
    types: [completed]

permissions:
  contents: write

jobs:
  check-release:
    name: Check for new release
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    outputs:
      released: ${{ steps.check.outputs.released }}

    steps:
      # The run was triggered by the merged commit, not by the "release:" commit
      # that semantic-release pushes afterwards, so look at main itself.
      - name: Check if main ends with a release commit
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUBJECT=$(gh api "repos/${{ github.repository }}/commits/main" --jq '.commit.message' | head -n1)
          echo "Latest commit on main: $SUBJECT"
          if [[ "$SUBJECT" == release:* ]]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  update-pods:
    name: Update Podfile.lock after release
    runs-on: macos-latest
    needs: check-release
    if: ${{ needs.check-release.outputs.released == 'true' }}
    env:
      XCODE_VERSION: latest-stable

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: main
          submodules: true

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install CocoaPods
        working-directory: example
        run: yarn ios:pods

      - name: Commit updated Podfile.lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add example/ios/Podfile.lock

          if git diff --cached --quiet; then
            echo "No Podfile.lock changes."
            exit 0
          fi

          git commit -m "chore(example): update Podfile.lock after release"
          git push origin main

  sync-dev:
    name: Sync dev with main
    runs-on: ubuntu-latest
    needs: [check-release, update-pods]
    if: ${{ always() && needs.check-release.outputs.released == 'true' }}

    steps:
      - name: Checkout dev
        uses: actions/checkout@v6.0.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: dev

      - name: Reset dev to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main dev

          git checkout dev
          git reset --hard origin/main

          git push --force-with-lease origin dev
